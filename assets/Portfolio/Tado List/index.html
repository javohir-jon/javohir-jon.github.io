<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link rel="stylesheet" href="output.css" />
    <title>Tables</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .static-modal {
        position: fixed;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.342);
        transform: translateY(0);
        z-index: -1;
        opacity: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: 0.3s;
      }
      .modal-open {
        opacity: 1;
        z-index: 100;
      }
      .static-modal .modal-form {
        width: 24%;
        height: 300px;
        background-color: #d1d5db;
        border-radius: 12px;
        padding: 24px;
        transform: translateY(100%);
        opacity: 1;
        transition: 0.5s;
      }
      .modal-open .modal-open-form {
        transform: translateY(0);
        opacity: 1;
      }
    </style>
  </head>

  <body>
    <main class="w-full h-screen bg-gray-200 flex justify-center pt-14">
      <section
        class="w-3/5 max-h-[750px] rounded-xl p-7 shadow-2xl bg-gray-100"
      >
        <h2 class="text-6xl text-black text-center font-black">
          Tado List App
        </h2>
        <form
          action="#"
          method="get"
          class="flex w-full h-12 justify-evenly mt-10"
        >
          <input
            type="text"
            name="text"
            id="user"
            placeholder="Enter Your Name"
            class="w-[500px] h-full px-5 rounded-md outline-none font-semibold text-xl"
            required
          />
          <input
            type="submit"
            value="Enter"
            class="w-[120px] h-full bg-blue-600 rounded-2xl text-white font-semibold text-2xl"
          />
        </form>
        <table class="w-full mt-6">
          <thead>
            <tr class="border-b border-solid border-black">
              <th>#</th>
              <th>Your Name</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody class=""></tbody>
        </table>
      </section>
      <section class="static-modal" id="sec">
        <form id="editform" class="modal-form modal-open-form">
          <button
            type="button"
            class="w-[30px] h-[30px] text-center bg-gray-600 rounded-[50%] ml-[90%] text-white"
            id="x"
          >
            <i class="fas fa-times"></i>
          </button>
          <br />
          <input
            class="w-full h-[40px] rounded-[10px] my-12 px-3 font-semibold outline-none"
            type="text"
            name="rename"
            id="einp"
          />
          <br />
          <button
            type="button"
            class="py-2 w-full mx-auto bg-blue-400 rounded-[10px] text-white text-xl"
            id="renamebtn"
          >
            Rename
          </button>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
